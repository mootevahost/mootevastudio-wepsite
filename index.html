<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOOteva Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="experience">
        <img
            id="mootevaHand"
            class="mooteva-hand"
            src="./assets/images/mooteva hand.png"
            alt="MOOteva hand"
        >

        <div class="hero-message">
            <div class="title-hi">
                <span class="hi-word">Hi</span><span class="hi-dot">.</span><span class="hi-dot">.</span>
            </div>
            <div class="title-high-five">High Five</div>
        </div>

        <div id="fallSequence" class="fall-sequence" aria-hidden="true"></div>

        <section id="comingSoon" class="coming-soon" aria-label="MOOteva Studio coming soon">
            <div class="coming-soon-content">
                <p class="coming-soon-kicker">MOOteva Studio</p>
                <h1>Coming Soon<span>.</span></h1>
                <p class="coming-soon-subtitle">A new creative world is taking shape.</p>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
